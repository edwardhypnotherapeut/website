    <path d="M60 610 C250 528 400 570 520 512 C660 446 800 470 950 400" stroke-width="1.2" opacity="0.7"/>
  </g>

  <g fill="#f3e4cc">
    <circle cx="240" cy="200" r="3"/>
    <circle cx="330" cy="300" r="2"/>
    <circle cx="420" cy="160" r="2.5"/>
    <circle cx="520" cy="250" r="2"/>
    <circle cx="820" cy="180" r="3"/>
    <circle cx="870" cy="300" r="2"/>
    <circle cx="760" cy="430" r="2.5"/>
    <circle cx="170" cy="380" r="2"/>
    <circle cx="300" cy="480" r="2"/>
  </g>

  <path d="M0 660 C180 620 300 650 460 630 C640 606 780 640 1000 600 V700 H0 Z" fill="#082420"/>
