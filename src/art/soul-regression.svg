<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a2a26"/>
      <stop offset="0.55" stop-color="#0f3a35"/>
      <stop offset="1" stop-color="#1b4d45"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f3dfc1" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#f3dfc1" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="1000" height="700" fill="url(#night)"/>
  <circle cx="660" cy="250" r="230" fill="url(#moonGlow)"/>

  <circle cx="660" cy="250" r="128" fill="#f0dcc0"/>
  <circle cx="710" cy="214" r="120" fill="#0f3a35" opacity="0.92"/>

