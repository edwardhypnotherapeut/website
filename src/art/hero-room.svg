<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 2000" width="1600" height="2000">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8f1e5"/>
      <stop offset="1" stop-color="#eee0cc"/>
    </linearGradient>
    <linearGradient id="arch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffaf1"/>
      <stop offset="1" stop-color="#f2dfc7"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7e3c8"/>
      <stop offset="1" stop-color="#efd2ad"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8e3d6"/>
      <stop offset="1" stop-color="#bfd2c2"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbf0da" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fbf0da" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="archClip">
      <path d="M300 1640 V820 A500 500 0 0 1 1300 820 V1640 Z"/>
    </clipPath>
  </defs>

  <rect width="1600" height="2000" fill="url(#wall)"/>

  <!-- Soft light behind the arch -->
  <circle cx="1060" cy="700" r="620" fill="url(#sunGlow)"/>

  <!-- Arch window -->
  <path d="M300 1640 V820 A500 500 0 0 1 1300 820 V1640 Z" fill="url(#arch)" stroke="#dcc19f" stroke-width="7"/>
  <g clip-path="url(#archClip)">
    <rect x="300" y="300" width="1000" height="1340" fill="url(#sky)"/>
    <circle cx="1030" cy="880" r="190" fill="#eccba2"/>
    <path d="M300 1320 C520 1210 700 1350 900 1270 C1080 1200 1200 1250 1300 1210 V1640 H300 Z" fill="url(#hill)"/>
    <path d="M300 1440 C560 1350 760 1480 980 1400 C1140 1340 1240 1390 1300 1370 V1640 H300 Z" fill="#a9c2ac" opacity="0.75"/>
  </g>

  <!-- Floor -->
  <rect x="0" y="1620" width="1600" height="380" fill="#e8d6bf"/>
  <ellipse cx="800" cy="1745" rx="580" ry="120" fill="#dcc1a2" opacity="0.6"/>

  <!-- Armchair -->
  <g>
    <rect x="905" y="1210" width="400" height="420" rx="185" fill="#123b35"/>
    <rect x="875" y="1490" width="460" height="190" rx="80" fill="#0d2f2a"/>
    <rect x="930" y="1450" width="350" height="110" rx="52" fill="#d9b591"/>
    <rect x="875" y="1600" width="60" height="140" rx="24" fill="#0a2723"/>
    <rect x="1275" y="1600" width="60" height="140" rx="24" fill="#0a2723"/>
  </g>

  <!-- Side table with vase and branch -->
  <g>
    <rect x="380" y="1470" width="330" height="26" rx="13" fill="#b98a5d"/>
    <rect x="415" y="1496" width="18" height="230" rx="9" fill="#a97b4f"/>
    <rect x="655" y="1496" width="18" height="230" rx="9" fill="#a97b4f"/>
    <path d="M520 1470 C500 1400 512 1350 548 1310 C566 1290 590 1284 604 1290 C604 1340 580 1400 545 1440 C536 1450 528 1460 520 1470 Z" fill="#0f3a35"/>
    <path d="M560 1470 C576 1408 604 1372 646 1352" stroke="#0f3a35" stroke-width="7" fill="none" stroke-linecap="round"/>
    <ellipse cx="652" cy="1346" rx="30" ry="14" fill="#0f3a35" transform="rotate(-24 652 1346)"/>
    <ellipse cx="606" cy="1378" rx="26" ry="12" fill="#1c4a42" transform="rotate(-38 606 1378)"/>
  </g>

  <!-- Floor plant -->
  <g>
    <path d="M215 1640 C170 1520 180 1400 250 1320" stroke="#0f3a35" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M215 1640 C255 1500 330 1440 405 1420" stroke="#0f3a35" stroke-width="9" fill="none" stroke-linecap="round"/>
    <ellipse cx="240" cy="1350" rx="62" ry="26" fill="#14453e" transform="rotate(-52 240 1350)"/>
    <ellipse cx="180" cy="1460" rx="55" ry="23" fill="#1b4c44" transform="rotate(-70 180 1460)"/>
    <ellipse cx="340" cy="1450" rx="62" ry="25" fill="#14453e" transform="rotate(-30 340 1450)"/>
    <ellipse cx="420" cy="1400" rx="52" ry="22" fill="#1b4c44" transform="rotate(-14 420 1400)"/>
    <path d="M150 1630 H300 L282 1720 H168 Z" fill="#c9a884"/>
  </g>

  <!-- Grain -->
  <rect width="1600" height="2000" filter="url(#grain)" opacity="0.055"/>
</svg>
