name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with Astro
        uses: withastro/action@v3
        with:
          node-version: 22
        env:
          # Set these as repository variables (Settings → Secrets and variables → Actions → Variables).
          # Project pages: SITE_URL=https://<user>.github.io  BASE_PATH=/<repo>
          SITE_URL: ${{ vars.SITE_URL || 'https://edwardhazebroek.nl' }}
          BASE_PATH: ${{ vars.BASE_PATH || '/' }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
